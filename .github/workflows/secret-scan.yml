# The repo's only CI. Local pytest stays the gate for correctness; this exists
# because a leaked credential is the one class of mistake a local-only gate
# cannot be trusted to catch, and the tree is public.
#
# gitleaks' own GitHub Action requires a license key for organization-owned
# repositories, so this installs the MIT-licensed CLI directly, pinned by
# version and verified by SHA-256 before it runs.
name: secret-scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Nothing here needs to push, and the scan must not have a credential
          # sitting in the workspace it is about to scan.
          persist-credentials: false

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          curl -fsSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f gitleaks.tar.gz gitleaks

      - name: Scan the tree
        # `--no-git` scans the checked-out files. A fresh clone contains exactly
        # what git tracks, which is exactly what publishing exposes; scanning
        # history instead would re-scan the same content once per commit.
        # `--redact` keeps any finding out of a public Actions log.
        run: gitleaks detect --source . --no-git --redact --config .gitleaks.toml
