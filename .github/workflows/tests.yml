# The test suite, which is the gate for correctness. It ran only on a
# developer's machine while the repo was private and every push came from one;
# a public repo takes pull requests from machines nobody here can see.
#
# The matrix is the point: the Lambda runs on 3.12 (see infra/stacks/
# receiver_stack.py) while local development happens on whatever recent Python
# is to hand, so without both, one of the two is only ever tested by luck.
name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[dev]"

      # The deployment-identifying ban patterns are a secret, not a tracked
      # file: a public ban list is an index of what it protects. A fork's run
      # is not given the secret and skips this step, so it tests the generic
      # patterns only — the same posture a stranger's clone gets locally.
      # Where the secret should exist, SENTINEL_REQUIRE_BANNED_LOCAL makes an
      # empty or missing list fail the suite instead of narrowing it quietly.
      - name: Materialize the private ban list
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          BANNED_PATTERNS: ${{ secrets.SENTINEL_BANNED_PATTERNS }}
        run: |
          printf '%s\n' "$BANNED_PATTERNS" > config/banned.local.txt
          echo "SENTINEL_REQUIRE_BANNED_LOCAL=1" >> "$GITHUB_ENV"

      # No AWS credentials and no Docker: the CDK tests synthesize a template
      # in-process, and the receiver tests stub boto3. The real config is
      # untracked, so this runs against exactly what a stranger clones.
      - name: Run the suite
        run: python -m pytest -q
