# Autofix: receiver-dispatched fix session. The session writes files; only
# the deterministic steps below touch GitHub, always as the autofix App.
name: autofix

on:
  repository_dispatch:
    types: [autofix]

permissions:
  contents: read

jobs:
  autofix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: autofix-${{ github.event.client_payload.sentry_issue_id }}
      cancel-in-progress: false
    steps:
      - name: Checkout engine repo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: engine
          # Load-bearing: without this, checkout writes the workflow
          # GITHUB_TOKEN into engine/.git/config. The unattended session
          # runs with Bash and is not filesystem-jailed, so it could read
          # that file (or `git -C ../engine config --get
          # http.https://github.com/.extraheader`) and recover a usable
          # credential. Nothing after this step pushes to or re-fetches
          # from engine, so there is no reason to keep it. Same rationale
          # as the product checkout below.
          persist-credentials: false

      - name: Mint App installation token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.AUTOFIX_APP_ID }}
          private-key: ${{ secrets.AUTOFIX_APP_PRIVATE_KEY }}
          owner: ${{ vars.AUTOFIX_TARGET_OWNER }}
          repositories: ${{ vars.AUTOFIX_TARGET_NAME }}

      - name: Checkout target repo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ vars.AUTOFIX_TARGET_OWNER }}/${{ vars.AUTOFIX_TARGET_NAME }}
          ref: ${{ vars.AUTOFIX_TARGET_BRANCH }}
          token: ${{ steps.app-token.outputs.token }}
          path: product
          fetch-depth: 0
          # Load-bearing: without this, checkout writes the App token into
          # product/.git/config. That checkout becomes AUTOFIX_WORKSPACE,
          # the directory the unattended session works in with Bash
          # allowed, so a persisted credential there would let an injected
          # session push using a token nobody handed it. The Publish step
          # authenticates its own git remote (via `gh auth setup-git`)
          # only after the session has already finished running.
          persist-credentials: false

      - name: Write payload and drift context
        id: context
        env:
          CLIENT_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: |
          # callback_url and callback_token are stripped before the session
          # can read this file via Read/Bash: that pair is a bearer
          # credential for /autofix-result, and the runner never needs it
          # (PROMPT_FIELDS excludes both; the callback step below reads
          # them straight from client_payload, not from this file).
          printf '%s' "$CLIENT_PAYLOAD" | jq 'del(.callback_url, .callback_token)' > payload.json
          RELEASE_SHA=$(jq -r .release_sha payload.json)
          jq -r '.cited_files[]' payload.json > cited.txt
          # cited_files comes from the dispatch payload, so it is
          # attacker-influenceable. Unquoted command substitution over
          # cited.txt's contents would let the shell word-split entries
          # containing spaces and let git glob-expand entries containing
          # wildcards, either of which desyncs the drift block from the
          # files it claims to cover. Reading
          # cited.txt into a quoted array (one element per line, no word
          # splitting) and setting GIT_LITERAL_PATHSPECS=1 (git treats
          # every pathspec as an exact path, no wildcard matching) closes
          # both holes. (git diff/log have no --pathspec-from-file: that
          # flag only exists on commands like checkout/add/commit.)
          CITED_FILES=()
          while IFS= read -r cited_path; do
            CITED_FILES+=("$cited_path")
          done < cited.txt
          cd product
          # An empty CITED_FILES array must not fall through to a bare
          # `git diff RELEASE_SHA..HEAD --` with no pathspec: that diffs
          # every changed file in the repo, dumping the whole release-to-
          # develop drift into the session prompt instead of the "cited
          # files only" diff this block promises. Guard the zero-element
          # case explicitly so no citations means an empty drift.patch,
          # which the runner reads as "no drift".
          if [ "${#CITED_FILES[@]}" -eq 0 ]; then
            : > ../drift.patch
          else
            GIT_LITERAL_PATHSPECS=1 git diff "${RELEASE_SHA}"..HEAD -- "${CITED_FILES[@]}" > ../drift.patch || true
          fi
          echo "release_sha=${RELEASE_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: engine/runner/requirements.txt

      - name: Run the fix session
        id: session
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          AUTOFIX_PAYLOAD_FILE: ${{ github.workspace }}/payload.json
          AUTOFIX_DRIFT_FILE: ${{ github.workspace }}/drift.patch
          AUTOFIX_WORKSPACE: ${{ github.workspace }}/product
          AUTOFIX_PROMPT_DIR: ${{ github.workspace }}/engine/prompts
        run: |
          pip install -r engine/runner/requirements.txt
          python engine/runner/autofix_runner.py

      - name: Publish
        id: publish
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          AUTOFIX_WORKSPACE: ${{ github.workspace }}/product
          AUTOFIX_SHORT_ID: ${{ github.event.client_payload.sentry_short_id }}
          AUTOFIX_DISPATCH_ID: ${{ github.event.client_payload.dispatch_id }}
          AUTOFIX_RELEASE_SHA: ${{ steps.context.outputs.release_sha }}
          AUTOFIX_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          AUTOFIX_TARGET_REPO: ${{ vars.AUTOFIX_TARGET_OWNER }}/${{ vars.AUTOFIX_TARGET_NAME }}
        run: |
          # The product checkout has no persisted git credential (see
          # persist-credentials above); set one up now, after the session
          # has already run, so the push below can authenticate.
          gh auth setup-git
          OUTPUT=$(python engine/scripts/autofix_publish.py)
          echo "$OUTPUT"
          echo "status=$(echo "$OUTPUT" | tail -n 1)" >> "$GITHUB_OUTPUT"
          echo "pr_url=$(echo "$OUTPUT" | grep -oP '(?<=^pr_url=).*' || true)" >> "$GITHUB_OUTPUT"

      - name: Report back to the receiver
        id: callback
        if: always()
        env:
          CALLBACK_URL: ${{ github.event.client_payload.callback_url }}
          CALLBACK_TOKEN: ${{ github.event.client_payload.callback_token }}
          STATUS: ${{ steps.publish.outputs.status || 'failed' }}
          PR_URL: ${{ steps.publish.outputs.pr_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DISPATCH_ID: ${{ github.event.client_payload.dispatch_id }}
        run: |
          jq -n --arg d "$DISPATCH_ID" --arg s "$STATUS" --arg p "$PR_URL" --arg r "$RUN_URL" \
            '{dispatch_id: $d, status: $s, pr_url: $p, run_url: $r}' \
            | curl --fail-with-body -sS -X POST "$CALLBACK_URL" \
                -H "Authorization: Bearer $CALLBACK_TOKEN" \
                -H "Content-Type: application/json" \
                -d @- || echo "::warning::callback failed; the receiver sweep will settle this dispatch"
