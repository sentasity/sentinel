# The tool policy both routines carry: the investigator and the probe.
# Applied to each routine's job_config.ccr.session_context; see the runbooks.
# read_allowlist: the only GitHub tools the session uses, also added to
#   allowed_tools with the prefix below. The duplicate search is not one of
#   them: the receiver runs it as the App, through its `search` operation.
# disallowed_tools: every other tool of the built-in GitHub server, reads
#   included, and every tool of the Sentry connector that changes anything
#   in Sentry. The session reads Sentry and never writes to it, so the
#   connector's reads stay available and its writes are withheld.
#   When a probe lists a GitHub tool not named in either list, or a Sentry
#   tool that writes and is not named here, add it before anything else
#   changes.
#   It also holds every tool of the platform's own claude-code-remote server
#   (adding a repository to the session, subscribing it to pull request
#   activity), which the session never needs: it works in the one
#   repository it checked out, and the receiver opens every pull request.
# sentry_prefix: the connector's tool prefix as the session sees it,
#   mcp__<connector name>__. A connector under another name needs its
#   entries renamed to match, or none of them applies.
# remote_prefix: the platform server's tool prefix.
prefix: mcp__github__
sentry_prefix: mcp__Sentry__
remote_prefix: mcp__claude-code-remote__
read_allowlist:
  - issue_read
disallowed_tools:
  - mcp__Sentry__add_issue_note
  - mcp__Sentry__add_team_to_project
  - mcp__Sentry__analyze_issue_with_seer
  - mcp__Sentry__create_alert_rule
  - mcp__Sentry__create_dsn
