# The GitHub tool policy both routines carry: the investigator and the probe.
# Applied to each routine's job_config.ccr.session_context; see the runbooks.
# read_allowlist: the only GitHub tools the session uses, also added to
#   allowed_tools with the prefix below.
# disallowed_tools: every other tool of the built-in GitHub server, reads
#   included. When a probe lists a GitHub tool not named in either list,
#   add it here before anything else changes.
prefix: mcp__github__
read_allowlist:
  - search_issues
  - issue_read
disallowed_tools:
  - mcp__github__actions_get
  - mcp__github__actions_list
  - mcp__github__actions_run_trigger
