# CodeRabbit is the reading gate for disclosures. gitleaks and the
# public-tree test still catch what can be matched or listed in advance;
# this is what reads a change and catches what nobody described. It replaced
# a dedicated scanning workflow, which had to hold a subscription credential
# as a repository secret to do the same job.
#
# request_changes_workflow is what makes it a gate rather than a second
# opinion. It blocks the merge until every comment is resolved, and
# resolving one is a click, so a false positive costs a moment while an
# unread finding costs whatever it was warning about. The previous
# arrangement reported a passing check while leaving major findings
# underneath, and they went unread.
reviews:
  profile: chill
  request_changes_workflow: true
  path_filters:
    # Generated: card fixtures come from scripts/preview_card.py and the
    # brand assets from docs/brand's generators. Review the generators.
    - "!fixtures/**"
    - "!docs/brand/assets/**"
  path_instructions:
    - path: "**"
      instructions: |
        This is a public repository for a generic tool. Everything tracked
        here is published, and nothing may describe a real deployment or a
        private codebase. Flag any comment, docstring, fixture, or
        documentation page that names another repository's internals (paths,
        modules, tooling), a real org or account identifier, a live endpoint,
        or measurements taken against a live system. Fixtures must describe
        the fictional acme-tools deployment only.

        When flagging a possible disclosure or credential, cite the file and
        line but never quote the offending value in the comment: review
        comments on this repository are public, and quoting would republish
        the thing being flagged.
